<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jurnal Trainer Executive</title>
<meta name="theme-color" content="#0A84FF">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Tata letak: satu kolom seperti buku catatan lapangan. Strip minggu menjadi navigasi utama; panel putih hanya untuk daftar catatan. */
:root{
  --bg:#EDF1F0;--surface:#FFFFFF;--surface-2:#E2E9E7;--ink:#12201E;--ink-2:#4B5C59;--line:#CBD6D3;
  --accent:#2250D9;--accent-ink:#FFFFFF;--accent-soft:#DCE5FB;--hl:#F4C430;
  --good:#1B7F52;--warn:#9A5B00;--bad:#BC3434;
  --c1:#2250D9;--c2:#0E8A7A;--c3:#C2570C;--c4:#8A3FC4;--c5:#A67C00;--c6:#5F6B68;--c7:#C23B6A;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1514;--surface:#162120;--surface-2:#1F2E2C;--ink:#E4EEEC;--ink-2:#9DB2AE;--line:#2B3D3A;
    --accent:#7C9BFF;--accent-ink:#0B1020;--accent-soft:#1C2A55;--hl:#F4C430;
    --good:#4CC38A;--warn:#E3A94A;--bad:#F27B7B;
    --c1:#7C9BFF;--c2:#3FC4B2;--c3:#F08C4B;--c4:#B98AEA;--c5:#E3B93C;--c6:#9AA9A6;--c7:#EE7EA3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1514;--surface:#162120;--surface-2:#1F2E2C;--ink:#E4EEEC;--ink-2:#9DB2AE;--line:#2B3D3A;
  --accent:#7C9BFF;--accent-ink:#0B1020;--accent-soft:#1C2A55;--hl:#F4C430;
  --good:#4CC38A;--warn:#E3A94A;--bad:#F27B7B;
  --c1:#7C9BFF;--c2:#3FC4B2;--c3:#F08C4B;--c4:#B98AEA;--c5:#E3B93C;--c6:#9AA9A6;--c7:#EE7EA3;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body)}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:960px;margin-inline:auto;padding-inline:16px;padding-block:14px 120px}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;margin-bottom:10px}
.brand{font:700 1.35rem var(--font-display);letter-spacing:-.01em}
.brand small{display:block;font:500 .68rem var(--font-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.sync{display:flex;align-items:center;gap:6px;font:500 .72rem var(--font-mono);color:var(--ink-2)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--good)}
.sync.warn i{background:var(--warn)}

.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;color:var(--ink-2);font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{background:var(--hl);color:#12201E;border-radius:999px;font:600 .68rem var(--font-mono);padding:1px 6px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn[disabled]{opacity:.55;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.note{background:var(--accent-soft);border-radius:10px;padding:10px 14px;display:flex;gap:8px 14px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.9rem;margin-bottom:16px}
.note.warn{background:color-mix(in srgb,var(--warn) 16%,var(--surface))}
.note p{min-width:0;flex:1 1 220px}

.strip{display:grid;grid-template-columns:28px repeat(7,minmax(0,1fr)) 28px;gap:4px;margin-bottom:18px}
.arrow{background:none;border:0;color:var(--ink-2);font-size:1.4rem;line-height:1;padding:0}
.day{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.day .dn{font:500 .66rem var(--font-mono);text-transform:uppercase;color:var(--ink-2);letter-spacing:.04em}
.day .dd{font:700 1.15rem var(--font-display);padding:0 4px}
.day.today .dd{box-shadow:inset 0 -3px 0 var(--hl)}
.day .dots{height:7px;display:flex;gap:2px;align-items:center}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.day[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day[aria-pressed=true] .dn{color:inherit;opacity:.85}
.day[aria-pressed=true] .dots i{background:var(--accent-ink)}

.daytitle{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.daytitle h2{font-size:1.4rem}
.pill{font:600 .7rem var(--font-mono);text-transform:uppercase;letter-spacing:.06em;background:var(--hl);color:#12201E;border-radius:999px;padding:3px 10px}
.sumline{color:var(--ink-2);font-size:.9rem;margin-bottom:12px;font-variant-numeric:tabular-nums}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 16px}
.panel.pad{padding:16px}
.entry{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.time{font:500 .75rem var(--font-mono);color:var(--ink-2);display:flex;flex-direction:column;gap:2px;padding-top:3px}
.entry h3{font-size:1.05rem}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--ink-2);font-size:.85rem;align-items:center;margin-top:3px}
.type{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink)}
.type i{width:9px;height:9px;border-radius:3px;background:var(--tc,var(--c6))}
.topic{margin-top:6px;font-weight:500}
.res{margin-top:2px;color:var(--ink-2)}
.entry>*{min-width:0}
.fu{margin-top:10px;padding:8px 10px;background:var(--surface-2);border-radius:8px;display:flex;gap:10px;align-items:flex-start;font-size:.88rem}
.fu.late{box-shadow:inset 3px 0 0 var(--bad)}
.fu.done .fu-t{text-decoration:line-through;color:var(--ink-2)}
.fu-m{font:500 .7rem var(--font-mono);color:var(--ink-2);margin-top:2px}
.fu.late .fu-m{color:var(--bad)}
.check{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--ink-2);background:var(--surface);display:grid;place-items:center;font-size:.8rem;line-height:1;padding:0;color:var(--accent-ink)}
.check.on{background:var(--good);border-color:var(--good)}

.empty{padding:28px 8px;text-align:center;color:var(--ink-2)}
.empty p+p,.empty p+button{margin-top:10px}

.pnav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.pnav .ttl{flex:1;min-width:0}
.pnav h2{font-size:1.4rem}
.pnav .sub{color:var(--ink-2);font-size:.88rem}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stat{background:var(--surface);padding:12px 14px;min-width:0}
.stat .v{font:700 1.7rem var(--font-display);font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font:500 .68rem var(--font-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin-top:4px}
.stat .d{font-size:.75rem;color:var(--ink-2);margin-top:2px}

.sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:24px 0 8px}
.sec h2{font-size:1.1rem}
.sec span{font:500 .72rem var(--font-mono);color:var(--ink-2)}

.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:196px;border-bottom:1px solid var(--line)}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;min-width:0;background:none;border:0;padding:0 0 6px}
.col .b{width:100%;max-width:44px;background:var(--accent);border-radius:6px 6px 2px 2px}
.col .b.none{background:var(--line)}
.col .h{font:500 .72rem var(--font-mono);font-variant-numeric:tabular-nums}
.col .x{font:500 .7rem var(--font-mono);color:var(--ink-2);text-align:center;line-height:1.25}
.col.today .x{color:var(--ink);font-weight:600}

.bars{display:flex;flex-direction:column}
.bar-row{display:grid;grid-template-columns:minmax(0,9rem) minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;font-size:.9rem}
.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:5px}
.bv{font:500 .75rem var(--font-mono);color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

.stores .s{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.stores .s:first-child{border-top:0}
.stores .n{font-weight:600;min-width:0}
.stores .m{font:500 .75rem var(--font-mono);color:var(--ink-2);text-align:right}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .hd{font:500 .68rem var(--font-mono);text-align:center;color:var(--ink-2);padding-bottom:2px}
.cell{aspect-ratio:1;max-width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--lv,var(--surface));color:var(--ink);display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:4px 6px;text-align:left}
.cell .cd{font:600 .85rem var(--font-display)}
.cell .cn{font:500 .66rem var(--font-mono)}
.cell.today{box-shadow:inset 0 0 0 2px var(--hl)}
.legend{display:flex;align-items:center;gap:4px;font:500 .68rem var(--font-mono);color:var(--ink-2);margin-top:8px}
.legend i{width:14px;height:14px;border-radius:4px;border:1px solid var(--line);background:var(--lv)}

.fugroup h3{font:600 .72rem var(--font-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);margin:20px 0 6px}
.fugroup h3.late{color:var(--bad)}
.fuitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.fuitem:first-child{border-top:0}
.fuitem .t{font-weight:500}
.fuitem.done .t{text-decoration:line-through;color:var(--ink-2)}
.fuitem .m{font:500 .72rem var(--font-mono);color:var(--ink-2);margin-top:3px}
details.fold summary{cursor:pointer;color:var(--ink-2);font-weight:600;padding:12px 0}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 14px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.rtext{width:100%;min-height:340px;resize:vertical;line-height:1.55;font-family:var(--font-body)}
.status{font:500 .75rem var(--font-mono);color:var(--ink-2);min-height:1.2em}
.status.err{color:var(--bad)}

label{font:500 .7rem var(--font-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);display:block;margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{resize:vertical}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid .full{grid-column:1/-1}
.grid>*{min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}

.help{color:var(--ink-2);font-size:.9rem;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;padding:4px 4px 4px 12px;font-weight:500;font-size:.9rem}
.chip i{width:9px;height:9px;border-radius:3px;background:var(--tc,var(--c6))}
.chip button{border:0;background:none;color:var(--ink-2);width:24px;height:24px;border-radius:50%;line-height:1;font-size:1rem;padding:0}
.chip button:hover{background:var(--line);color:var(--ink)}
.add{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.add input{flex:1 1 180px;min-width:0}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow .n{font-weight:600;min-width:0}
.srow .a{font:500 .72rem var(--font-mono);color:var(--ink-2)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:14px 22px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.28);z-index:10}
.overlay{position:fixed;inset:0;background:rgba(8,14,13,.58);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:640px;max-height:94%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet h2{font-size:1.3rem}
.aibox{background:var(--accent-soft);border-radius:12px;padding:12px;margin-bottom:16px}
.aibox textarea{background:var(--surface)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.88rem;font-weight:500;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;text-align:center}
.toast.on{opacity:1}
@media (min-width:700px){
  .overlay{align-items:center}
  .sheet{border-radius:18px}
}
@media (max-width:480px){
  .bar-row{grid-template-columns:minmax(0,6.5rem) minmax(0,1fr) auto}
  .stat .v{font-size:1.45rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.evgrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.evth{position:relative;width:72px;height:72px}
.evth img,.evt img{width:100%;height:100%;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;display:block}
.evth button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--bad);color:#fff;line-height:1;padding:0}
.evrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.evt{width:56px;height:56px}
.evgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.evgal figure{margin:0}.evgal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.evgal figcaption{font-size:.72rem;color:var(--ink-2);margin-top:2px}
.lb{position:fixed;inset:0;z-index:95;background:rgba(5,8,14,.92);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.lb img{max-width:94vw;max-height:78vh;border-radius:6px}
.deck{position:fixed;inset:0;z-index:90;background:#05080F;display:flex;flex-direction:column}
.dbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 12px;background:#0B1220;color:#F3EFE6}
.dwrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:8px}
.stage{container-type:inline-size;width:min(100%,calc((100vh - 110px)*1.7778));aspect-ratio:16/9;background:linear-gradient(135deg,#0B1220,#16233F);position:relative;overflow:hidden;border-radius:6px}
.sl{position:absolute;inset:0;padding:4.5cqw 6cqw 4cqw 7cqw;color:#F3EFE6;font:1.5cqw/1.4 var(--font-body);display:flex;flex-direction:column}
.sl:before{content:"";position:absolute;left:0;top:0;bottom:0;width:.9cqw;background:#D4AF37}
.sl .eb{font:600 1.1cqw var(--font-mono);letter-spacing:.25em;color:#D4AF37;text-transform:uppercase}
.sl h1{font:700 5.2cqw/1.08 var(--font-display);margin:1.4cqw 0}
.sl h2{font:700 3.2cqw/1.1 var(--font-display);margin:.5cqw 0 2.2cqw}
.sl .sb{font-size:2cqw}.sl .wh{color:#9AA8C2;margin-top:1.2cqw}.sl .cv{margin:auto 0}.sl-end{justify-content:center}
.kps{display:grid;grid-template-columns:repeat(4,1fr);gap:1.6cqw}
.kp{background:#16233F;border:1px solid #2A3B5F;border-radius:1.2cqw;padding:2.2cqw 1.6cqw}
.kp b{display:block;font:700 4.2cqw var(--font-display);color:#D4AF37}.kp span{color:#C9D3E6}.kp i{display:block;font-style:normal;font-size:1.1cqw;color:#9AA8C2;margin-top:.6cqw}
.db{display:grid;grid-template-columns:22cqw 1fr 14cqw;align-items:center;gap:1.4cqw;margin-bottom:1.2cqw}
.db .t{height:1.1cqw;border-radius:1cqw;background:#23314F;overflow:hidden}.db .t i{display:block;height:100%;background:linear-gradient(90deg,#D4AF37,#F0D98A)}.db small{color:#9AA8C2;font-size:1.2cqw}
.cds{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6cqw}
.cd{background:#16233F;border:1px solid #2A3B5F;border-radius:1.2cqw;padding:1.8cqw}
.cd h3{font:700 1.8cqw var(--font-display);margin:0}.cd .m{color:#D4AF37;font-size:1.1cqw;margin:.3cqw 0 1cqw}.cd p{margin:0 0 .8cqw;font-size:1.3cqw;color:#DCE3F1}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4cqw}.ph figure{margin:0}
.ph img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:1cqw;display:block}.ph figcaption{font-size:1.1cqw;color:#9AA8C2;margin-top:.3cqw}

function lsSet(k,v){try{localStorage.setItem(LS+k,JSON.stringify(v))}catch(e){}}
var uid8=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)};

/* ---------- penyimpanan: lokal dulu, server Google Sheet bila link diisi ---------- */
var SRV=function(){return String(S.settings.server||'').trim()};
function persist(){try{localStorage.setItem(LS+'entries',JSON.stringify(S.entries))}catch(e){toast('Penyimpanan perangkat penuh. Aktifkan server atau hapus foto lama.')}}
function srvBody(p){return Object.assign({owner:S.settings.name||'',key:S.settings.key||'',drive:S.settings.drive||''},p)}
async function srv(p){
  if(!SRV())throw new Error('Link server kosong');
  var r=await fetch(SRV()+(SRV().indexOf('?')<0?'?':'&')+'p='+encodeURIComponent(JSON.stringify(srvBody(p))),{redirect:'follow'});
  var j;try{j=await r.json()}catch(x){throw new Error('Server tidak membalas JSON. Pastikan Web App di-deploy dengan akses "Anyone" dan memakai versi Code.gs terbaru.')}
  if(!j.ok)throw new Error(j.error||'Server error');return j;
}
async function srvPost(p){
  if(!SRV())throw new Error('Link server kosong');
  await fetch(SRV(),{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(srvBody(p))});
}
function srvHint(x){var m=String(x&&x.message||x);return /Load failed|Failed to fetch|NetworkError/i.test(m)?'tidak bisa menjangkau server. Cek link /exec dan pastikan akses Web App "Anyone"':m}
async function initStore(){
  S.mode='local';S.entries=lsGet('entries',[]);Object.assign(S.settings,lsGet('settings',{}));
  applyPrefs();S.ready=true;refresh();
  if(SRV())pull();
}
async function initExtras(){
  S.downloads={save:async function(o){
    var bl=o.data instanceof Blob?o.data:new Blob([o.data],{type:'text/plain;charset=utf-8'});
    var a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=o.filename;document.body.append(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
  }};
  refresh();
}
async function push(e){
  S.sync='busy';renderTop();
  try{
    await srvPost({action:'upsert',entry:e});
    var j=await srv({action:'list'}),r=(j.entries||[]).find(function(x){return x.id===e.id});
    if(!r)throw new Error('Data belum diterima server. Cek deployment Code.gs.');
    S.entries=S.entries.map(function(x){return x.id===e.id?Object.assign({},x,{evidence:r.evidence,updatedAt:r.updatedAt||x.updatedAt,sync:true}):x});
    persist();S.sync='ok';refresh();
  }catch(x){S.sync='err';S.syncErr=srvHint(x);renderTop()}
}
async function pull(){
  if(!SRV())return;
  if(!S.settings.name){toast('Isi Nama di Pengaturan dulu agar data terpisah per trainer.');return}
  S.sync='busy';renderTop();
  try{
    var j=await srv({action:'list'}),map={};
    (j.entries||[]).forEach(function(e){map[e.id]=Object.assign(e,{sync:true})});
    S.entries.forEach(function(e){var r=map[e.id];if(!r||(e.updatedAt||0)>(r.updatedAt||0))map[e.id]=e});
    S.entries=Object.keys(map).map(function(k){return map[k]});persist();S.sync='ok';refresh();
    var pend=S.entries.filter(function(e){return !e.sync});
    for(var i=0;i<pend.length;i++)await push(pend[i]);
  }catch(x){S.sync='err';S.syncErr=srvHint(x);renderTop()}
}
async function saveEntry(data,id){
  id=id||uid8();var e=Object.assign({},data,{id:id,updatedAt:Date.now()});
  S.entries=S.entries.some(function(x){return x.id===id})?S.entries.map(function(x){return x.id===id?e:x}):[e].concat(S.entries);
  persist();refresh();if(SRV())push(e);
}
async function patchEntry(id,patch){
  S.entries=S.entries.map(function(e){return e.id===id?Object.assign({},e,patch,{updatedAt:Date.now(),sync:false}):e});
  persist();refresh();
  var e=S.entries.find(function(x){return x.id===id});if(e&&SRV())push(e);
}
async function removeEntry(id){
  S.entries=S.entries.filter(function(e){return e.id!==id});persist();refresh();
  if(SRV()){try{await srv({action:'delete',id:id})}catch(x){S.sync='err';renderTop()}}
}
async function saveSettings(){lsSet('settings',S.settings)}

/* ---------- evidence (foto) ---------- */
function shrink(f){return new Promise(function(res,rej){
  var r=new FileReader();r.onerror=rej;
  r.onload=function(){var im=new Image();im.onerror=rej;im.onload=function(){
    var s=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    res(c.toDataURL('image/jpeg',.68))};im.src=r.result};
  r.readAsDataURL(f)})}
function lightbox(list,i){
  var root=h('div',{class:'lb',onclick:function(ev){if(ev.target===root)root.remove()}}),img=h('img',{alt:'evidence'});
  var show=function(){img.src=list[i]},mv=function(n){i=(i+n+list.length)%list.length;show()};
  put(root,img,h('div',{class:'row',style:'justify-content:center'},
    list.length>1?h('button',{class:'btn',type:'button',onclick:function(){mv(-1)}},'‹'):null,
    list.length>1?h('button',{class:'btn',type:'button',onclick:function(){mv(1)}},'›'):null,
    h('button',{class:'btn',type:'button',onclick:function(){root.remove()}},'Tutup')));
  show();document.body.append(root);
}
function evThumbs(ev){
  if(!ev||!ev.length)return null;
  return h('div',{class:'evrow'},ev.map(function(u,i){return h('div',{class:'evt'},h('img',{src:u,alt:'evidence',loading:'lazy',onclick:function(){lightbox(ev,i)}}))}));
}
function evGal(list,title){
  var items=[];
  list.forEach(function(e){(e.evidence||[]).forEach(function(u){items.push({u:u,cap:shortDate(e.date)+' · '+(e.store||'')})})});
  if(!items.length)return null;
  var urls=items.map(function(i){return i.u});
  return h('div',null,sec(title,items.length+' foto'),h('div',{class:'panel pad'},h('div',{class:'evgal'},items.map(function(it,i){
    return h('figure',null,h('img',{src:it.u,alt:it.cap,loading:'lazy',onclick:function(){lightbox(urls,i)}}),h('figcaption',null,it.cap))}))));
}

/* ---------- agregasi ---------- */
function stats(list){
  var s={count:list.length,min:0,part:0,stores:new Map(),types:new Map(),days:new Map(),visited:0};
  list.forEach(function(e){
    var m=dur(e);s.min+=m;s.part+=+e.participants||0;
    var bump=function(map,key){var v=map.get(key)||{n:0,min:0,last:''};v.n++;v.min+=m;if(e.date>v.last)v.last=e.date;map.set(key,v)};
    if(e.store&&e.type!=='Administrasi & laporan')bump(s.stores,e.store.trim());
    bump(s.types,e.type||'Lainnya');
    bump(s.days,e.date);
  });
  s.visited=s.stores.size;
  return s;
}
var sortedMap=function(map){return Array.from(map.entries()).sort(function(a,b){return b[1].n-a[1].n||b[1].min-a[1].min})};

function delta(cur,prev,dec){
  if(prev==null)return null;
  var d=Math.round((cur-prev)*Math.pow(10,dec||0))/Math.pow(10,dec||0);
  var txt=d===0?'sama dengan sebelumnya':(d>0?'+':'−')+Math.abs(d).toLocaleString(LOC,{maximumFractionDigits:dec||0})+' dari sebelumnya';
  return h('div',{class:'d'},txt);
}
function tiles(st,prev){
  var T=function(v,l,d){return h('div',{class:'stat'},h('div',{class:'v'},v),h('div',{class:'l'},l),d||null)};
  return h('div',{class:'stats'},
    T(fmtN(st.count),'Aktivitas',prev&&delta(st.count,prev.count)),
    T(fmtJam(st.min),'Jam kerja',prev&&delta(st.min/60,prev.min/60,1)),
    T(fmtN(st.part),'Peserta',prev&&delta(st.part,prev.part)));
}

  E().forEach(function(e){if(e.date>=ws&&e.date<=addDays(ws,6))cnt[e.date]=(cnt[e.date]||0)+1});
  var el=h('div',{class:'strip'});
  el.append(h('button',{class:'arrow',type:'button','aria-label':'Minggu sebelumnya',onclick:function(){S.day=addDays(S.day,-7);render()}},'‹'));
  for(var i=0;i<7;i++){(function(i){
    var d=addDays(ws,i),n=cnt[d]||0;
    el.append(h('button',{class:'day'+(d===t?' today':''),type:'button','aria-pressed':String(d===S.day),'aria-label':longDate(d)+', '+n+' catatan',onclick:function(){S.day=d;render()}},

      h('span',{class:'dots'},Array.from({length:Math.min(n,3)},function(){return h('i')}))));

}

function fuItem(e){

function vTindak(){
  var t=today(),all=E().filter(function(e){return e.followup});
  var open=all.filter(function(e){return !e.fuDone});
  var late=open.filter(function(e){return e.fuDue&&e.fuDue<t}).sort(function(a,b){return a.fuDue<b.fuDue?-1:1});
  var soon=open.filter(function(e){return e.fuDue&&e.fuDue>=t}).sort(function(a,b){return a.fuDue<b.fuDue?-1:1});
  var none=open.filter(function(e){return !e.fuDue}).sort(cmp);
  var done=all.filter(function(e){return e.fuDone}).sort(function(a,b){return a.date<b.date?1:-1}).slice(0,20);
  var root=h('div');
  put(root,errNote(),demoNote(),h('div',{class:'daytitle'},h('h2',null,'Tindak lanjut'),h('span',{class:'sumline',style:'margin:0'},open.length+' belum selesai')));
  if(!all.length){
    put(root,h('div',{class:'panel pad'},h('div',{class:'empty'},h('p',null,'Belum ada tindak lanjut. Isi kolom tindak lanjut saat mencatat aktivitas, dan daftarnya muncul di sini.'))));
    return root;
  }
  var group=function(title,items,cls){
    if(!items.length)return null;
    return h('div',{class:'fugroup'},h('h3',{class:cls||''},title+' · '+items.length),h('div',{class:'panel'},items.map(fuItem)));
  };
  put(root,group('Terlambat',late,'late'),group('Akan jatuh tempo',soon),group('Tanpa batas waktu',none));
  if(!open.length)put(root,h('div',{class:'panel pad'},h('div',{class:'empty'},h('p',null,'Semua tindak lanjut sudah selesai.'))));
  if(done.length)put(root,h('details',{class:'fold'},h('summary',null,'Selesai ('+done.length+' terbaru)'),h('div',{class:'panel'},done.map(fuItem))));

}

    rate_limited:'Terlalu sering atau batas pemakaian tercapai. Coba lagi nanti.',

function summaryText(list){

}
function buildPrompt(list,r){
  var s=S.settings,st=stats(list);
  var lines=list.map(function(e){
    return '- '+e.date+' ('+dayName(e.date)+') '+(e.start||'?')+'–'+(e.end||'?')+' | '+e.store+(e.area?' ('+e.area+')':'')+(typesOn()&&e.type?' | '+e.type:'')+' | peserta: '+(e.participants||0)+' | topik: '+(clip(e.topic)||'-')+' | hasil: '+(clip(e.result)||'-')+' | tindak lanjut: '+(clip(e.followup)||'-')+(e.followup?(e.fuDone?' [selesai]':' [belum selesai'+(e.fuDue?', batas '+e.fuDue:'')+']'):'');
  }).join('\n');
  var carry=openFu().filter(function(e){return !inR(e,r.from,r.to)&&S.entries.indexOf(e)>=0}).slice(0,30).map(function(e){
    return '- '+clip(e.followup)+' ('+e.store+', dicatat '+e.date+(e.fuDue?', batas '+e.fuDue:'')+')';
  }).join('\n');
  return 'Tulis laporan '+r.name+' kerja seorang trainer lapangan untuk dikirim ke atasan. Gunakan Bahasa Indonesia yang rapi, ringkas, dan profesional.\n\n'
    +'Identitas: nama '+(s.name||'(belum diisi)')+', jabatan '+(s.role||'Trainer Lapangan')+', wilayah '+(s.area||'-')+'.\n'
    +'Periode: '+r.label+'.\n'
    +'Angka ringkasan (sudah dihitung, pakai persis): '+summaryText(list)+'.\n\n'
    +'Data aktivitas pada periode ini:\n'+lines+'\n\n'
    +'Tindak lanjut dari periode lain yang masih terbuka:\n'+(carry||'(tidak ada)')+'\n\n'
    +'Format keluaran: teks polos tanpa markdown (jangan pakai tanda ** atau #), siap ditempel ke WhatsApp atau email. Mulai dengan judul laporan dan identitas, lalu bagian berjudul huruf kapital: RINGKASAN, AKTIVITAS UTAMA (kelompokkan per toko), TEMUAN DAN KENDALA, TINDAK LANJUT DAN RENCANA. Gunakan tanda "-" untuk butir.\n'
    +'Aturan: hanya gunakan fakta dari data di atas. Jangan menambah angka, nama, atau capaian yang tidak ada. Jika suatu bagian tidak punya data, tulis satu kalimat bahwa belum ada catatan. Bagian rencana diambil dari tindak lanjut yang belum selesai.';
}
function draftReport(list,r){
  var s=S.settings,out=[];
  out.push(LANG==='en'?'FIELD TRAINER '+T(r.name).toUpperCase()+' REPORT':'LAPORAN '+r.name.toUpperCase()+' TRAINER LAPANGAN');
  out.push(T('Nama')+': '+(s.name||'-')+' | '+T('Jabatan')+': '+(s.role||'Trainer Lapangan')+' | '+T('Wilayah')+': '+(s.area||'-'));
  out.push(T('Periode')+': '+T(r.label),'',T('RINGKASAN'),'- '+T(summaryText(list)),'',T('AKTIVITAS UTAMA'));
  var by=new Map();
  list.forEach(function(e){var k=e.store||'(tanpa toko)';if(!by.has(k))by.set(k,[]);by.get(k).push(e)});
  by.forEach(function(items,store){
    out.push(store);
    items.forEach(function(e){out.push('- '+shortDate(e.date)+': '+T(typesOn()&&e.type?e.type:'Kunjungan')+(e.participants?', '+e.participants+' peserta':'')+(e.topic?'. '+e.topic:'')+(e.result?'. '+T('Hasil')+': '+e.result:'')+(e.evidence&&e.evidence.length?' ['+e.evidence.length+' '+T('foto evidence')+']':''))});
  });
  out.push('',T('TINDAK LANJUT DAN RENCANA'));
  var fu=list.filter(function(e){return e.followup});
  if(!fu.length)out.push('- '+T('Belum ada tindak lanjut tercatat.'));
  fu.forEach(function(e){out.push('- ['+(e.fuDone?'selesai':'belum')+'] '+e.followup+' ('+e.store+(e.fuDue?', batas '+shortDate(e.fuDue):'')+')')});
  return out.join('\n');
}
async function generate(){
  if(isDemo()){toast('Catat aktivitas Anda dulu. Laporan tidak dibuat dari data contoh.');return}
  var r=rpRange(),list=rpList();
  if(!list.length){S.report.err='Belum ada aktivitas pada periode ini.';render();return}
  var ctl=new AbortController();
  S.report.ctl=ctl;S.report.busy=true;S.report.err='';S.report.text='';S.report.status='Claude sedang menulis…';
  render();
  try{
    var res=await S.sample(buildPrompt(list,r),{signal:ctl.signal,cache:false,onText:function(u){
      S.report.text=u.text;var ta=$('rp-text');if(ta)ta.value=u.text;
    }});
    S.report.text=res.text;
    S.report.status=res.truncated?'Laporan terpotong. Coba periode yang lebih pendek.':'Draf siap. Periksa, ubah bila perlu, lalu simpan.';
  }catch(e){
    S.report.text=(e&&e.text)||S.report.text;
    if(e&&e.code==='cancelled')S.report.status='Dihentikan.';
    else{S.report.err=sampleErr(e&&e.code);S.report.status=''}
  }finally{
    S.report.busy=false;S.report.ctl=null;render();
  }
}

function buildDeck(){
  var r=rpRange(),list=rpList(),st=stats(list),s=S.settings,y=+S.rp.anchor.slice(0,4),m=+S.rp.anchor.slice(5,7);
  var pa=S.rp.kind==='week'?addDays(r.from,-7):fmtD(new Date(y,m-2,1)),pb=addDays(r.from,-1);
  var pv=stats(S.entries.filter(function(e){return inR(e,pa,pb)}));
  var dl=function(c,p){if(!pv.count)return '';var d=Math.round((c-p)*10)/10;return (d>0?'▲ +':d<0?'▼ −':'• ')+Math.abs(d).toLocaleString(LOC)+' '+T('dari sebelumnya')};
  var eb=T(r.name).toUpperCase(),D=[],chunk=function(a,n){var o=[];for(var i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o};
  D.push({k:'cover',eb:eb,title:LANG==='en'?'Field Trainer Report':'Laporan Trainer Lapangan',sub:T(r.label),who:[s.name,s.role||'Trainer Lapangan',s.area].filter(Boolean).join('  ·  ')});
  D.push({k:'stats',eb:eb,title:T('Ringkasan'),items:[
    [fmtN(st.count),T('Aktivitas'),dl(st.count,pv.count)],[T(fmtJam(st.min)),T('Jam kerja'),dl(st.min/60,pv.min/60)],
    [fmtN(st.visited),T('Toko dikunjungi'),dl(st.visited,pv.visited)],[fmtN(st.part),T('Peserta'),dl(st.part,pv.part)]]});
  var bars=function(map,n){var it=sortedMap(map).slice(0,n),mx=Math.max.apply(null,[1].concat(it.map(function(i){return i[1].n})));
    return it.map(function(i){return {l:T(i[0]),p:i[1].n/mx,v:i[1].n+'× · '+T(fmtJam(i[1].min))}})};
  if(typesOn()&&st.types.size)D.push({k:'bars',eb:eb,title:T('Jenis aktivitas'),rows:bars(st.types,7)});
  if(st.stores.size)D.push({k:'bars',eb:eb,title:T('Toko dikunjungi'),rows:bars(st.stores,8)});
  chunk(list.filter(function(e){return e.result||e.topic}),3).forEach(function(c){
    D.push({k:'cards',eb:eb,title:T('Hasil & temuan'),cards:c.map(function(e){return {h:e.store||'-',m:shortDate(e.date)+(e.type?' · '+T(e.type):''),p:e.topic||'',r:e.result||''}})})});
  var ph=[];list.forEach(function(e){(e.evidence||[]).forEach(function(u){ph.push({u:u,c:shortDate(e.date)+' · '+(e.store||'')})})});
  chunk(ph,6).forEach(function(c){D.push({k:'photos',eb:eb,title:T('Dokumentasi kegiatan'),ph:c})});
  var fu=list.filter(function(e){return e.followup});
  chunk(fu,6).forEach(function(c){D.push({k:'list',eb:eb,title:T('Tindak lanjut & rencana'),rows:c.map(function(e){

  D.push({k:'end',title:T('Terima kasih'),sub:T('Diskusi & tanya jawab')});
  return D;
}

function openDeck(){
  if(isDemo()){toast('Catat aktivitas Anda dulu.');return}
  if(!rpList().length){toast('Belum ada aktivitas pada periode ini.');return}
  var D=buildDeck(),i=0,ov=h('div',{class:'deck',role:'dialog','aria-modal':'true'}),stage=h('div',{class:'stage'}),cnt=h('span',{style:'min-width:56px;text-align:center'},'');
  var show=function(){stage.replaceChildren(slideEl(D[i],i,D.length));cnt.textContent=(i+1)+' / '+D.length};
  var go=function(n){i=Math.max(0,Math.min(D.length-1,i+n));show()};
  var key=function(ev){if(ev.key==='ArrowRight'||ev.key===' ')go(1);else if(ev.key==='ArrowLeft')go(-1);else if(ev.key==='Escape')close()};
  var close=function(){document.removeEventListener('keydown',key);ov.remove()};
  document.addEventListener('keydown',key);
  var B=function(t,fn){return h('button',{class:'btn sm',type:'button',onclick:fn},t)};
  put(ov,h('div',{class:'dbar'},
    h('div',{class:'row'},B('‹',function(){go(-1)}),cnt,B('›',function(){go(1)})),
    h('div',{class:'row'},B('Layar penuh',function(){ov.requestFullscreen&&ov.requestFullscreen()}),B('Export .pptx',function(){exportPptx(false)}),B('Export .key',function(){exportPptx(true)}),B('Tutup',close))),
    h('div',{class:'dwrap'},stage));
  document.body.append(ov);show();
}
var pptxP=null;
function loadPptx(){
  if(window.PptxGenJS)return Promise.resolve();
  return pptxP||(pptxP=new Promise(function(ok,no){var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js';s.onload=ok;s.onerror=function(){pptxP=null;no()};document.head.append(s)}));
}
var imgCache={};
async function driveData(urls){
  var out=urls.map(function(u){return String(u).indexOf('data:')===0?u:(imgCache[u]||null)});
  var need=[];
  urls.forEach(function(u,i){if(!out[i]){var m=/[?&]id=([^&]+)/.exec(u);if(m&&SRV())need.push([i,m[1]])}});
  for(var k=0;k<need.length;k+=4){
    var part=need.slice(k,k+4);
    try{
      var j=await srv({action:'images',ids:part.map(function(x){return x[1]})});
      part.forEach(function(x){var d=(j.images||{})[x[1]];if(d){out[x[0]]=d;imgCache[urls[x[0]]]=d}});
    }catch(e){}
  }
  for(var i=0;i<urls.length;i++)if(!out[i])out[i]=await toData(urls[i]);
  return out;
}
async function toData(u){
  if(String(u).indexOf('data:')===0)return u;
  try{var b=await (await fetch(u)).blob();return await new Promise(function(ok,no){var r=new FileReader();r.onload=function(){ok(r.result)};r.onerror=no;r.readAsDataURL(b)})}catch(e){return null}
}

function onStoreSel(ev){
  var val=ev.target.value,t=$('f-store'),a=$('f-area'),o=val==='__other';
  t.hidden=!o;t.required=o;
  if(o){t.focus();return}
  var s=storeList0().find(function(x){return x.n===val});
  if(s&&s.a&&a&&(!a.value||a.dataset.auto==='1')){a.value=s.a;a.dataset.auto='1'}
}
function applyStore(name){
  var sel=$('f-store-sel'),t=$('f-store');
  if(!name)return;
  if(sel){
    var low=name.toLowerCase();
    var hit=storeList0().find(function(x){return x.n.toLowerCase()===low});
    if(hit){sel.value=hit.n;onStoreSel({target:sel})}
    else{sel.value='__other';onStoreSel({target:sel});t.value=name}
  }else if(t)t.value=name;
}
function closeSheet(){$('sheetRoot').replaceChildren();S.sheet=null;document.body.style.overflow=''}
async function submitSheet(ev){
  ev.preventDefault();
  var g=function(id){return $(id).value.trim()};
  var err=$('sheet-err');err.textContent='';
  var start=g('f-start'),end=g('f-end');
  if(start&&end&&toMin(end)<=toMin(start)){err.textContent='Jam selesai harus setelah jam mulai.';return}
  var old=S.sheet&&S.sheet.id?S.entries.find(function(x){return x.id===S.sheet.id}):null;
  var sel=$('f-store-sel');
  var store=sel&&sel.value&&sel.value!=='__other'?sel.value:g('f-store');
  if(!store){err.textContent='Pilih atau isi nama toko.';return}
  var fu=g('f-fu');
  var data={
    date:g('f-date'),store:store,area:g('f-area'),type:$('f-type')?g('f-type'):'',start:start,end:end,
    participants:Math.max(0,parseInt(g('f-part'),10)||0),topic:g('f-topic'),result:g('f-result'),
    followup:fu,fuDue:fu?g('f-due'):'',fuDone:fu&&old?!!old.fuDone:false,
    createdAt:old&&old.createdAt?old.createdAt:Date.now(),
    evidence:(S.sheet&&S.sheet.ev)||[]
  };
  var btn=ev.target.querySelector('button[type=submit]');btn.disabled=true;
  try{
    await saveEntry(data,S.sheet&&S.sheet.id);
    if(data.type)lsSet('lastType',data.type);
    if(S.tab==='harian'){S.day=data.date}
    closeSheet();toast('Catatan tersimpan');render();
  }catch(e){
    btn.disabled=false;
    err.textContent='Catatan belum tersimpan. Periksa koneksi, lalu coba lagi.';
  }
}

    +(withType?'Jenis aktivitas yang valid: '+typeList().join(' | ')+'.\n':'')

    +'Aturan: jangan mengarang. Kosongkan ("" atau 0) bila tidak disebut. Bila nama toko mirip dengan toko yang sudah ada, pakai ejaan yang sudah ada. Terjemahkan kata seperti "kemarin", "tadi pagi", atau "Senin lalu" berdasarkan tanggal hari ini.';

/* ---------- pengaturan ---------- */
function parseStores(txt){
  return txt.split(/\r?\n/).map(function(l){return l.trim()}).filter(Boolean).map(function(l){
    var m=l.match(/^([^,;\t]+)[,;\t]?\s*(.*)$/);
    return {n:m[1].trim(),a:(m[2]||'').trim()};
  }).filter(function(x){return x.n});
}
function addStores(list){
  var cur=storeList0().slice(),seen=new Set(cur.map(function(s){return s.n.toLowerCase()})),added=0;
  list.forEach(function(s){
    var k=s.n.toLowerCase();
    if(seen.has(k))return;
    seen.add(k);cur.push({n:s.n,a:s.a});added++;
  });
  cur.sort(function(a,b){return a.n.localeCompare(b.n,'id')});
  S.settings.stores=cur;
  return added;
}

  });

  var storePanel=h('div',{class:'panel pad'},
    h('p',{class:'help'},'Daftar ini menjadi pilihan toko saat mencatat, dan area terisi otomatis. Tempel satu toko per baris. Tulis area setelah koma bila ada.'),
    h('label',{for:'st-bulk'},'Tambah toko'),
    h('textarea',{id:'st-bulk',name:'st-bulk',rows:5,placeholder:'Toko Kelapa Gading, Jakarta Utara\nToko Bintaro, Tangerang Selatan\nToko Bekasi'}),
    h('div',{class:'row',style:'margin:10px 0 4px'},
      h('button',{class:'btn primary',type:'button',onclick:function(){
        var list=parseStores($('st-bulk').value);
        if(!list.length){toast('Tulis nama toko dulu.');return}
        var n=addStores(list);
        commit();toast(n?n+' toko ditambahkan':'Semua toko itu sudah ada di daftar');
      }},'Tambahkan ke daftar'),
      fromLog.size?h('button',{class:'btn',type:'button',onclick:function(){
        var n=addStores(Array.from(fromLog.values()));commit();toast(n+' toko ditambahkan dari catatan Anda');
      }},'Ambil '+fromLog.size+' toko dari catatan lama'):null));
  var storeRows=h('div',{class:'panel',style:'margin-top:12px'});
  if(!stores.length)storeRows=h('div',{class:'help',style:'margin-top:12px'},'Daftar masih kosong. Saat mencatat, nama toko diketik sendiri.');
  else stores.forEach(function(s){
    storeRows.append(h('div',{class:'srow'},
      h('div',null,h('div',{class:'n'},s.n),s.a?h('div',{class:'a'},s.a):null),
      h('button',{class:'btn ghost sm',type:'button','aria-label':'Hapus '+s.n,onclick:function(){
        S.settings.stores=storeList0().filter(function(x){return x.n!==s.n});commit();
      }},'Hapus')));
  });

  var seg=function(opts,cur,fn){return h('div',{class:'seg',role:'group'},opts.map(function(o){return h('button',{type:'button','aria-pressed':String(cur===o[0]),onclick:function(){fn(o[0])}},o[1])}))};
  var prefPanel=h('div',{class:'panel pad'},
    h('label',null,'Tampilan'),seg([['auto','Otomatis (ikuti perangkat)'],['light','Terang'],['dark','Gelap']],cfg.theme||'auto',function(v){cfg.theme=v;applyPrefs();saveSettings();render()}),
    h('label',{style:'display:block;margin-top:16px'},'Bahasa'),seg([['id','Bahasa Indonesia'],['en','English']],cfg.lang||'id',function(v){cfg.lang=v;applyPrefs();saveSettings();render()}));
  var srvPanel=h('div',{class:'panel pad'},
    h('p',{class:'help'},'Tempel URL Web App Google Apps Script (lihat Code.gs). Semua catatan dan foto evidence disimpan ke Google Sheet kantor. Nama di Identitas dipakai sebagai pemilik data, jadi isi dulu.'),
    h('div',{class:'grid'},idField('Link server (Google Sheet)','s-srv','server','https://script.google.com/macros/s/…/exec','full'),idField('Kode akses (opsional)','s-key','key','','full'),idField('Folder Google Drive untuk evidence','s-drv','drive','https://drive.google.com/drive/folders/…','full')),
    h('p',{class:'help',style:'margin-top:10px'},'Folder Drive pribadi: bagikan folder itu ke akun pemilik script sebagai Editor. Subfolder per tanggal (dd-mm-yyyy) dibuat otomatis. Kosongkan untuk memakai folder bawaan.'),
    h('div',{class:'row',style:'margin-top:12px'},h('button',{class:'btn primary',type:'button',onclick:async function(){
      if(!SRV()){toast('Isi link server dulu.');return}
      try{await srv({action:'ping'});toast('Terhubung');pull()}catch(x){toast('Gagal terhubung: '+srvHint(x))}}},'Tes koneksi & sinkronkan')));
  var chips=h('div',{class:'chips'},types.map(function(t){
    return h('span',{class:'chip',style:'--tc:var(--c'+typeColor(t)+')'},h('i'),t,
      h('button',{type:'button','aria-label':'Hapus jenis '+t,onclick:function(){
        S.settings.types=typeList().filter(function(x){return x!==t});commit();
      }},'×'));
  }));
  var addType=function(){
    var inp=$('ty-new'),v=inp.value.trim();
    if(!v)return;
    var cur=typeList().slice();
    if(cur.some(function(x){return x.toLowerCase()===v.toLowerCase()})){toast('Jenis itu sudah ada');return}
    cur.push(v);S.settings.types=cur;commit();
  };
  var typePanel=h('div',{class:'panel pad'},
    h('p',{class:'help'},types.length?'Jenis aktivitas dipakai sebagai pilihan saat mencatat dan untuk ringkasan per jenis. Hapus yang tidak Anda perlukan, atau tambah sendiri.':'Daftar kosong, jadi kolom jenis aktivitas disembunyikan dari formulir dan ringkasan. Tambahkan jenis di bawah bila ingin memakainya lagi.'),
    types.length?chips:null,
    h('div',{class:'add'},
      h('input',{id:'ty-new',name:'ty-new',type:'text',placeholder:'Jenis baru, mis. Pelatihan toko',onkeydown:function(ev){if(ev.key==='Enter'){ev.preventDefault();addType()}}}),
      h('button',{class:'btn',type:'button',onclick:addType},'Tambah')),
    h('div',{class:'row',style:'margin-top:14px'},
      types.length?armBtn('Hapus semua jenis','Ya, hapus semua',function(){S.settings.types=[];commit()},'danger'):null,
      Array.isArray(cfg.types)?h('button',{class:'btn ghost',type:'button',onclick:function(){delete S.settings.types;commit()}},'Kembalikan jenis bawaan'):null));

  put(root,errNote(),demoNote(),
    h('div',{class:'daytitle'},h('h2',null,'Pengaturan')),
    h('p',{class:'help'},'Atur halaman ini sesuai pekerjaan Anda. Perubahan langsung berlaku dan tidak mengubah catatan lama.'),
    sec('Tampilan & bahasa'),prefPanel,sec('Server data (Google Sheet)'),srvPanel,sec('Daftar toko',stores.length?stores.length+' toko':''),storePanel,storeRows,
    stores.length?h('div',{class:'row',style:'margin-top:10px'},armBtn('Kosongkan daftar toko','Ya, kosongkan',function(){S.settings.stores=[];commit()},'danger')):null,
    sec('Jenis aktivitas'),typePanel,
    sec('Identitas di laporan'),
    h('div',{class:'panel pad'},h('div',{class:'grid'},
      idField('Nama','s-name','name','Nama lengkap','full'),
      idField('Jabatan','s-role','role','Trainer Lapangan'),
      idField('Wilayah','s-area','area','mis. Jabodetabek'))));
  return root;
}

/* ---------- render ---------- */
var VIEWS={harian:vHarian,minggu:vMinggu,bulan:vBulan,tindak:vTindak,laporan:vLaporan,pengaturan:vPengaturan};
function renderTop(){
  var s=$('sync'),has=!!SRV(),k=S.sync;
  var msg=!S.ready?'Memuat…':!has?'Tersimpan di peramban ini saja':k==='busy'?'Menyinkronkan…':k==='err'?'Gagal sinkron, data aman di perangkat'+(S.syncErr?' ('+S.syncErr+')':''):'Tersinkron ke server';
  s.className='sync'+(has&&k!=='err'?'':' warn');
  s.replaceChildren(h('i'),T(msg));s.title=T(msg);
  var br=document.querySelector('.brand');br.replaceChildren(h('small',null,'Catatan kunjungan toko'),T('Jurnal Trainer Executive'));
  $('fab').textContent=T('+ Catat aktivitas');document.title=T('Jurnal Trainer Executive');
}
function renderNav(){
  var open=S.ready?openFu().length:0;
  $('tabs').replaceChildren.apply($('tabs'),TABS.map(function(t){
    return h('button',{class:'tab',type:'button',role:'tab','aria-selected':String(S.tab===t[0]),onclick:function(){setTab(t[0])}},
      t[1],t[0]==='tindak'&&open?h('span',{class:'badge'},open):null);
  }));
}
function render(){
  renderTop();renderNav();
  $('view').replaceChildren(S.ready?VIEWS[S.tab]():h('div',{class:'empty'},'Memuat catatan…'));
  S.dirty=false;
}
function refresh(){
  var a=document.activeElement;
  if(a&&$('view').contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){S.dirty=true;return}
  render();
}
function setTab(t){
  S.tab=t;
  if(t==='laporan')loadReport();
  render();
  window.scrollTo(0,0);
}
function fillClock(el){
  var n=new Date();
  el.querySelector('.clk-t').textContent=n.toLocaleTimeString(LOC,{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).replace(/\./g,':');
  el.querySelector('.clk-d').textContent=n.toLocaleDateString(LOC,{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  el.title=(Intl.DateTimeFormat().resolvedOptions().timeZone||'')+' · '+n.toLocaleTimeString('en-US',{timeZoneName:'short'}).split(' ').pop();
}
setInterval(function(){document.querySelectorAll('.clock').forEach(fillClock)},1000);
document.querySelectorAll('.clock').forEach(fillClock);
document.addEventListener('focusout',function(){setTimeout(function(){if(S.dirty)refresh()},60)});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&S.sheet)closeSheet()});
$('fab').addEventListener('click',function(){openSheet(null,S.tab==='harian'?{date:S.day}:{date:today()})});

render();
initStore();
initExtras();
})();
</script>

</body></html>
